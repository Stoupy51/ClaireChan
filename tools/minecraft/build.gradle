plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.+'
}

version = '0.1.0'
group = 'dev.stoupy'
base {
	archivesName = 'clairechan-bridge'
}

loom {
	runs {
		client {
			runDir 'run'
			programArgs '--username', 'ClaireChan'
			// Stack kept ready under every Java frame: shaderc recurses deeper than the JVM grows a stack from native code, which kills the client on Windows.
			vmArg '-XX:StackShadowPages=38'
		}
		// More clients, for several sessions testing at once or several players in one test, CLIENTS in services/minecraft.py.
		(2..3).each { n ->
			register("client$n") {
				inherit client
				configName = "Minecraft Client $n"
				runDir "run$n"
				programArgs '--username', "ClaireChan$n"
				vmArg "-Dclairechan.bridge.port=${47620 + n}"
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}
